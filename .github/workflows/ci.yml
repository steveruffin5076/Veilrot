name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build (TASK-M1-05 — one command produces the static build folder)
        run: npm run build

      - name: Assert payload budget (NFR-WEB-01, <=5MB)
        run: npm run check:payload-budget

      - name: Install Playwright's browser
        run: npx playwright install --with-deps chromium

      - name: Smoke test
        run: npm run smoke-test
